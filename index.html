<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#7ee0c2" />

    <!-- Ícones e instalação como app.
         O manifest atende Android/Chrome; o iOS ignora o manifest e usa
         apple-touch-icon, que por isso é achatado sobre a menta: o Safari
         compõe transparência sobre preto. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ANA Brasil" />
    <meta name="application-name" content="ANA Brasil" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- O que aparece na aba do navegador e no cartão de link (WhatsApp,
         Facebook, LinkedIn, X). Até 08/09/2026 tudo isto era o texto padrão
         do template Lovable, em inglês, com uma captura do Lovable como imagem;
         era isso que a família via ao receber o link da programação.
         A imagem vive em public/og-eventos.jpg, 1200x630: para trocar a arte,
         basta substituir o arquivo com o mesmo nome. -->
    <title>ANA Brasil</title>
    <meta name="description" content="Confira os próximos eventos confirmados da ANA Brasil em todas as unidades: DIC, Nilópolis e Santana." />
    <meta name="author" content="ANA Brasil" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ANA Brasil" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://app.anabrasil.org/eventos" />
    <meta property="og:title" content="Programação de Eventos · ANA Brasil" />
    <meta property="og:description" content="Confira os próximos eventos confirmados da ANA Brasil em todas as unidades: DIC, Nilópolis e Santana." />
    <meta property="og:image" content="https://app.anabrasil.org/og-eventos.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crianças e jovens da ANA Brasil desfilando com bandeiras e tambores" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Programação de Eventos · ANA Brasil" />
    <meta name="twitter:description" content="Confira os próximos eventos confirmados da ANA Brasil em todas as unidades: DIC, Nilópolis e Santana." />
    <meta name="twitter:image" content="https://app.anabrasil.org/og-eventos.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
